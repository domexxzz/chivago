# Every claim the README makes about tests, proven on a machine nobody owns.
#
# The suites run ONE PACKAGE AT A TIME (`--workspace-concurrency=1`), on
# purpose: in parallel they exhaust memory on a 2-core runner exactly as they
# do on a laptop - scrypt fails to derive a key and the mobile renderer takes
# a hard OOM. Sequential costs a minute and is the difference between a suite
# you trust and one you re-run.
#
# That rule is about one runner. Across runners there is no shared memory to
# exhaust, which is why the TypeScript half is four jobs rather than one: it
# was a single job of twelve steps and on 12 November it stopped finishing
# inside its twenty minutes, so every pull request went red on a clock rather
# than on a test. Each job below now carries a quarter of the work, starts
# its own runner, and reports which part broke instead of "the job".
#
# Node 24, matching the Dockerfile. `node:sqlite` is unflagged from 22.13 and
# `module.registerHooks` (the mobile test harness) exists from 22.15; the
# root package.json says so. Anything older fails before the first test.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Everything that needs Cloudflare's runtime rather than Node's. Its own job
  # because two of the three start `wrangler dev`, which is slow to come up and
  # has nothing to do with whether the Node suites pass.
  workers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same API suite as `test`, through the Durable Object adapter
      # (apps/api/src/do-storage.ts) instead of node:sqlite directly. It is
      # the only thing that keeps the adapter honest: the stand-in refuses
      # exactly the SQL Cloudflare's runtime refuses, so a statement that
      # would fail on Workers fails here instead of after a deploy.
      - run: pnpm --filter @chivago/api test:durable
      # A real alarm, in a real Durable Object, in real workerd. Worth its
      # minutes: an alarm books the next alarm, and if that ever stops, all
      # scheduled work on the object stops silently, SOS escalation included.
      - run: pnpm --filter @chivago/api test:alarm
      # The migration, end to end, in the runtime it will run in: export a
      # snapshot, send the batches over HTTP to a real Durable Object, read
      # the data back through the public API.
      - run: pnpm --filter @chivago/api test:import

  # The cheap guards. They finish in a couple of minutes and used to sit at the
  # end of the long job, which meant a timeout upstream hid them entirely.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The console stylesheet is generated from public/modernist.css into a
      # module the bundle carries. A stale module means the console serves
      # last week's styles, which for this stylesheet can mean invisible form
      # fields - so it is a build failure, not a surprise in production.
      - run: node scripts/build-console-css.mjs --check
      - run: pnpm test:scripts
      # New user-facing copy must be complete in English, Thai and Simplified
      # Chinese. Suspected bare JSX is reported for review without blocking.
      - run: pnpm localization:check
      # The Thai copy audit is advisory until a native speaker has been through
      # it, so it reports and does not fail the build. It is here so the count
      # is visible on every run and a regression is a number that went up.
      - run: node scripts/thai-review.mjs
        continue-on-error: true

  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
        working-directory: packages/sdk-dart
      - run: dart analyze
        working-directory: packages/sdk-dart
      # Decodes the tracked contract/api-samples.json from the repository root.
      - run: dart test
        working-directory: packages/sdk-dart

  swift:
    runs-on: macos-latest
    # Thirty, not fifteen. A cold macOS runner resolves and compiles the
    # package from nothing, and on 12 November it was still doing that when
    # fifteen minutes ran out - the build had not failed, it had not finished.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # The package that "had never been compiled" for its first forty commits.
      - run: swift build
        working-directory: packages/sdk-swift
      - run: swift test
        working-directory: packages/sdk-swift
