# ChivaGo on Fly.io.
#
#   fly auth login
#   fly launch --no-deploy --copy-config --name chivago
#   fly volumes create chivago_data --size 1 --region sin
#   fly deploy
#   fly ssh console -C "node --experimental-strip-types apps/api/src/seed-db.ts"
#
# The seed prints each host's console key ONCE. Capture them from that output;
# only the hash is stored and there is no way to read them back.

app = "chivago"
# Singapore: the closest region to Koh Samui, and the difference between a
# check-in that feels instant and one that feels like a form submission.
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  CHIVAGO_DB = "/data/chivago.db"
  CHIVAGO_WEB_DIR = "/repo/web"
  # Locked to the app's own origin. The web build is served from here, so it
  # needs no cross-origin grant at all, and a wildcard on a deployment with a
  # host console behind it is a wildcard on the console too.
  CHIVAGO_ORIGINS = "https://chivago.fly.dev"
  # No opening balance in production. The pilot's 320 Trip / 1,240 Green is a
  # gift to try the app with, and a gift handed to every unauthenticated
  # registration is a voucher printer. Green in particular is the currency an
  # auditor is asked to trust; every point of it here must come through a host.
  CHIVAGO_OPENING_TRIP = "0"
  CHIVAGO_OPENING_GREEN = "0"
  # Registrations per address per rolling hour. See `POST /devices`.
  CHIVAGO_REGISTRATIONS_PER_HOUR = "10"

# node:sqlite writes to a file. Without this the database is inside the
# container layer and every deploy silently resets the pilot.
[mounts]
  source = "chivago_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true

  # ONE machine, and never zero. SQLite is a file on one disk: a second machine
  # would be a second database, diverging from the first, and neither would be
  # wrong in a way anyone could detect from the outside.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
