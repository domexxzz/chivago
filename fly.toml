# ChivaGo on Fly.io.
#
#   fly auth login
#   fly launch --no-deploy --copy-config --name chivago
#   fly volumes create chivago_data --size 1 --region sin
#   fly deploy
#   fly ssh console -u node -C "node --experimental-strip-types apps/api/src/seed-db.ts"
#
# The seed prints each host's console key ONCE. Capture them from that output;
# only the hash is stored and there is no way to read them back.
#
# seed-db runs ONCE, on the empty volume. On a database that has places it
# refuses: re-seeding re-asserts every seeded row and deletes every place and
# quest the seed does not list. An area opened later - a new campus - goes in
# with the insert-only script, after the deploy that ships its seed:
#
#   fly ssh console -u node -C "node --experimental-strip-types apps/api/src/seed-area.ts --area <key>"
#
# `-u node` because the database belongs to node; the shell is root otherwise.

app = "chivago"
# Singapore: the closest region to Koh Samui, and the difference between a
# check-in that feels instant and one that feels like a form submission.
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  CHIVAGO_DB = "/data/chivago.db"
  # Uploaded clips and photographs, ON THE VOLUME beside the database.
  #
  # Without this they land in the image layer, so a deploy keeps the story
  # rows and throws the files away, and the board fills with grey boxes for
  # clips that are still listed. Cost two real uploads on 9 September.
  CHIVAGO_UPLOADS = "/data/uploads"
  CHIVAGO_WEB_DIR = "/repo/web"
  # Locked to the app's own origin. The web build is served from here, so it
  # needs no cross-origin grant at all, and a wildcard on a deployment with a
  # host console behind it is a wildcard on the console too.
  CHIVAGO_ORIGINS = "https://chivargo.com,https://www.chivargo.com,https://chivago.fly.dev"
  # THE GEOFENCE IS CLOSED. Opened 24 October at the owner's request so a
  # check-in could be made from anywhere, and shut again on the 29th - five
  # days. Before that: opened 9 September for testing, shut on the 10th, the
  # day before the pitch.
  #
  # ROWS FROM 24-29 OCTOBER ARE NOT PRESENCE EVIDENCE. Every check-in, quest
  # arrival and story recorded in that window passed no distance, accuracy,
  # mock-location or travel check, because none of them was running. The app
  # said so at the time - the red band was up throughout - but the rows
  # themselves carry no mark, so anyone auditing this database later has to
  # read the window off this paragraph. Green Points issued then rest on the
  # host who passed the proof and on nothing else.
  #
  # WHAT IT COSTS TO OPEN IT, for whoever reads this next: presence stops
  # being checked at all, and nothing recorded while it is open is evidence
  # that a person was ever at the place.
  #
  # Closing it is what takes the red band off the top of the app: the band is
  # not decoration, it is the second half of the switch (apps/api/src/fence.ts
  # rule 2). Removing the band while the fence stayed open would have left
  # every review saying it came from somebody the app confirmed was standing
  # there - a false statement about evidence, at a pitch whose whole claim is
  # that its evidence is real.
  #
  # It works at the venue because the venue is seeded. Standing in Building 13
  # puts three places inside the 250 m radius - the building itself, the
  # library at 188 m and the campus park at 210 m - and the viewpoint at 293 m,
  # the sports field at 371 m and the shops at 656 m are a short walk, which
  # earns a measured leg and hatches an egg.
  #
  # To reopen it: CHIVAGO_FENCE_OFF = "1" and redeploy. The band comes back
  # with it, and that is not negotiable.
  #
  # It WAS reopened, by accident: the line rode in on 11 September inside a
  # commit about animating cards (9834451), under this paragraph saying the
  # opposite, and production ran with the fence open until 22 October.
  # Shut again then. A switch this important belongs in a commit of its own,
  # going either way: the commit that opened it on 24 October carried nothing
  # else, and neither does this one, which shuts it.
  # No opening balance in production. The pilot's 320 Trip / 1,240 Green is a
  # gift to try the app with, and a gift handed to every unauthenticated
  # registration is a voucher printer. Green in particular is the currency an
  # auditor is asked to trust; every point of it here must come through a host.
  CHIVAGO_OPENING_TRIP = "0"
  CHIVAGO_OPENING_GREEN = "0"
  # NO LIMIT ON REGISTRATIONS, on purpose.
  #
  # A hall of a hundred people shares one address, so any per-address limit
  # refuses the back half of the room, and at a pitch that reads as the app
  # being broken. Zero means no limit (see `POST /devices`), and it is only
  # safe here because the opening balance above is zero: minting an account
  # mints nothing. Put a number back before this deployment ever hands out
  # points on registration.
  CHIVAGO_REGISTRATIONS_PER_HOUR = "0"
  # The stories door (docs/46) is a moderator's switch in the console, not an
  # env var, so it needs no deploy on the day. Setting CHIVAGO_STORIES_OPEN=1
  # here would hold the door open through a deploy; leave it unset.
  #
  # NOTHING IS REVIEWED BEFORE IT IS PUBLIC.
  #
  # A clip or a photograph used to wait in a queue until a host passed it,
  # and that queue is why a screen in a room full of people was safe to point
  # at. The owner asked for posting to be immediate, so it is: a story is
  # born approved. What remains is all after the fact - the console hides any
  # story in one click and a hide takes it off every surface at once, and
  # every clip expires by itself in seven days. The app says so where
  # somebody is about to post, in red, because the room they are posting into
  # is the one thing they cannot see. Delete this line to put the queue back.
  CHIVAGO_STORIES_AUTO_APPROVE = "1"
  # CHIVAGO_EVENT_TOKEN IS DELIBERATELY UNSET. With a token, only a phone that
  # arrived through the QR code in the room can post a clip; the owner asked
  # for anyone reaching the app by any link to be able to do everything, so
  # there is no token to carry. Nothing unapproved reaches a screen either
  # way - a host still has to pass every clip - so what this opens is who may
  # QUEUE one, not what appears. `fly secrets set CHIVAGO_EVENT_TOKEN=<random>`
  # puts the gate back for a room that needs it.

# node:sqlite writes to a file. Without this the database is inside the
# container layer and every deploy silently resets the pilot.
[mounts]
  source = "chivago_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true

  # ONE machine. SQLite is a file on one disk: a second machine would be a
  # second database, diverging from the first, and neither would be wrong in a
  # way anyone could detect from the outside.
  #
  # It may now SLEEP, which that rule does not forbid: a stopped machine is
  # still one machine and one database. Until this change `min_machines_running
  # = 1` with `auto_stop_machines = false` kept a shared-cpu-2x with 1GB awake
  # in Singapore around the clock whether or not anybody visited, and that is
  # what the September and October invoices were - $17.89 for a part-month and
  # $34.46 for a full one, on a pilot with no real users yet.
  #
  # `auto_start_machines` wakes it on the next request, so the first visitor
  # after an idle spell waits a second or two. That is the trade, and it is the
  # wrong trade on a demo day: set `min_machines_running = 1` again for the
  # morning if somebody is going to present this, rather than finding out live.
  #
  # The one-database rule still holds, with one thing to know. Autostart starts
  # the machine that EXISTS; it does not create one. So this is safe while the
  # app has exactly one machine provisioned, and `fly status -a chivago` is how
  # to confirm that - not an assumption worth carrying.
  #
  # `stop` rather than `suspend`: suspend resumes faster but does not apply to
  # a machine with a volume attached, and this one mounts `chivago_data`.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  # Two shared cores and a gigabyte, not one and a half.
  #
  # A load test on 10 September measured the 512 MB box at 719 req/s with zero
  # failures at 50 concurrent readers, so reads were never the worry. Memory
  # was: apps/api/src/server.ts buffers each upload whole
  # (Buffer.from(await file.arrayBuffer())) with a 25 MB ceiling per file, and
  # ffmpeg re-encodes every clip. Ten people posting a video at once could put
  # 250 MB of buffers plus the transcoder on a 512 MB machine, which is the way
  # this falls over at an event - not the request rate.
  #
  # node:sqlite is SYNCHRONOUS and this is one Node process, so the second core
  # does not double throughput. It buys headroom for ffmpeg to run without
  # stalling the event loop that is also serving everyone else.
  size = "shared-cpu-2x"
  memory = "1024mb"
